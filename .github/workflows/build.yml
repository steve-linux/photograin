name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # libjxl needs only these of its own submodules (not its test data or tool dependencies).
      - name: libjxl dependencies
        run: git -C app/src/main/cpp/libjxl submodule update --init --depth 1 third_party/highway third_party/brotli third_party/skcms
      # ncnn needs glslang to compile its Vulkan shaders, not its Python bindings.
      - name: ncnn dependencies
        run: git -C app/src/main/cpp/ncnn submodule update --init --depth 1 glslang
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: photograin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports/
