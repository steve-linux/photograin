# Sito di Photograin (https://photograin.netlify.app), generato da site/genera-sito.py.
# Netlify ripubblica solo quando un push cambia la cartella site/ o la versione dell'app.
[build]
  base = "site"
  command = "python3 genera-sito.py"
  publish = "website"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../app/build.gradle.kts"
